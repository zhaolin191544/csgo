<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="880" height="390" fill="none"/>
<text x="0" y="22" fill="#9aa0a6" font-size="12.5">本报告证据强度最高的一组数据</text>
<text x="14" y="95" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">A</text>
<text x="48" y="95" fill="#9aa0a6" font-size="12">默认 1GB（基准）</text>
<text x="292" y="95" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">82,726</text>
<rect x="300" y="80" width="182.9" height="22" rx="4" fill="#94a3b8" opacity="0.88"/>
<text x="491.9" y="96" fill="#9aa0a6" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">—</text>
<text x="14" y="141" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">G</text>
<text x="48" y="141" fill="#9aa0a6" font-size="12">A + 仅 xloginsert_locks=48</text>
<text x="292" y="141" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">84,908</text>
<rect x="300" y="126" width="187.7" height="22" rx="4" fill="#475569" opacity="0.88"/>
<text x="496.7" y="142" fill="#475569" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+2.6%</text>
<text x="14" y="187" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">E'</text>
<text x="48" y="187" fill="#9aa0a6" font-size="12">4GB + 监控关闭项</text>
<text x="292" y="187" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">164,871</text>
<rect x="300" y="172" width="364.5" height="22" rx="4" fill="#fbbf24" opacity="0.88"/>
<text x="673.5" y="188" fill="#fbbf24" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+99.3%</text>
<text x="14" y="233" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">F</text>
<text x="48" y="233" fill="#9aa0a6" font-size="12">A + 仅 buffer→8GB</text>
<text x="292" y="233" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">169,457</text>
<rect x="300" y="218" width="374.6" height="22" rx="4" fill="#38bdf8" opacity="0.88"/>
<text x="683.6" y="234" fill="#38bdf8" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+104.8%</text>
<text x="14" y="279" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">D</text>
<text x="48" y="279" fill="#9aa0a6" font-size="12">8GB + wal_level + max_conn</text>
<text x="292" y="279" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">175,998</text>
<rect x="300" y="264" width="389.0" height="22" rx="4" fill="#a78bfa" opacity="0.88"/>
<text x="698.0" y="280" fill="#a78bfa" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+112.8%</text>
<text x="14" y="325" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">B</text>
<text x="48" y="325" fill="#9aa0a6" font-size="12">KAOT 全量 151GB</text>
<text x="292" y="325" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">178,780</text>
<rect x="300" y="310" width="395.2" height="22" rx="4" fill="#27FF64" opacity="0.88"/>
<text x="704.2" y="326" fill="#27FF64" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+116.1%</text>
<line x1="300" y1="74" x2="300" y2="346" stroke="rgba(255,255,255,0.22)"/>
<rect x="8" y="212" width="836" height="34" rx="7" fill="none" stroke="#38bdf8" stroke-dasharray="5 4" opacity="0.6"/>
<text x="14" y="356" fill="#e8eaed" font-size="12.5">F 组只改一个参数即达到 +104.8%——占全量模板绝对吞吐的 94.8%、增益的 90.3%</text>
<text x="14" y="377" fill="#9aa0a6" font-size="11.5">G 组（xloginsert_locks，曾被怀疑是高并发关键项）实测仅 +2.6%，在噪声量级内</text>
</svg>