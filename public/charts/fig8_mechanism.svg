<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="880" height="330" fill="none"/>
<text x="0" y="22" fill="#5b6673" font-size="12.5">100 终端 · pg_stat_database</text>
<rect x="30" y="76" width="270" height="180" rx="12" fill="rgba(0,0,0,0.035)" stroke="rgba(0,0,0,0.10)"/>
<text x="50" y="104" fill="#64748b" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">A  默认 1GB</text>
<text x="50" y="150" fill="#1f2328" font-size="34" font-weight="800" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">98.953<tspan font-size="18" fill="#5b6673">%</tspan></text>
<text x="50" y="170" fill="#5b6673" font-size="11.5">缓存命中率</text>
<line x1="50" y1="188" x2="280" y2="188" stroke="rgba(0,0,0,0.09)"/>
<text x="50" y="212" fill="#5b6673" font-size="12">物理读总数</text>
<text x="280" y="212" fill="#1f2328" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">4,542,035</text>
<text x="50" y="236" fill="#5b6673" font-size="12">折合每秒</text>
<text x="280" y="236" fill="#64748b" font-size="14" font-weight="700" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">≈ 15,140</text>
<rect x="330" y="76" width="270" height="180" rx="12" fill="rgba(0,0,0,0.035)" stroke="rgba(0,0,0,0.10)"/>
<text x="350" y="104" fill="#16a34a" font-size="13.5" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">B  KAOT 151GB</text>
<text x="350" y="150" fill="#1f2328" font-size="34" font-weight="800" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">99.934<tspan font-size="18" fill="#5b6673">%</tspan></text>
<text x="350" y="170" fill="#5b6673" font-size="11.5">缓存命中率</text>
<line x1="350" y1="188" x2="580" y2="188" stroke="rgba(0,0,0,0.09)"/>
<text x="350" y="212" fill="#5b6673" font-size="12">物理读总数</text>
<text x="580" y="212" fill="#1f2328" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">600,831</text>
<text x="350" y="236" fill="#5b6673" font-size="12">折合每秒</text>
<text x="580" y="236" fill="#16a34a" font-size="14" font-weight="700" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">≈ 2,000</text>
<text x="308" y="172" fill="#d97706" font-size="26" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">7.5×</text>
<rect x="630" y="76" width="250" height="180" rx="12" fill="rgba(217,119,6,0.07)" stroke="rgba(217,119,6,0.28)"/>
<text x="648" y="104" fill="#d97706" font-size="13" font-weight="700">为什么只在高并发致命</text>
<text x="648" y="128" fill="#5b6673" font-size="11.8">每次缺页都要走 clock-sweep</text>
<text x="648" y="148" fill="#5b6673" font-size="11.8">选牺牲页，并修改全局 buffer</text>
<text x="648" y="168" fill="#5b6673" font-size="11.8">映射哈希表 —— 需要加锁。</text>
<text x="648" y="188" fill="#5b6673" font-size="11.8"></text>
<text x="648" y="208" fill="#1f2328" font-size="11.8">16 终端：撞锁概率低，可忽略</text>
<text x="648" y="228" fill="#1f2328" font-size="11.8">100 终端：排队时间超线性增长</text>
<text x="30" y="314" fill="#1f2328" font-size="13">小 buffer 的代价不是「慢一点」，而是<tspan fill="#d97706" font-weight="700">多出一段串行路径</tspan>——阿姆达尔定律的典型表现</text>
</svg>