<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="880" height="444" fill="none"/>
<text x="0" y="22" fill="#9aa0a6" font-size="12.5">相对 A 组（默认 1GB）的 tpmC 变化</text>
<line x1="493.8" y1="70" x2="493.8" y2="364" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
<line x1="300.0" y1="70" x2="300.0" y2="364" stroke="rgba(255,255,255,0.08)"/>
<text x="300.0" y="381" fill="#9aa0a6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">-10%</text>
<line x1="396.9" y1="70" x2="396.9" y2="364" stroke="rgba(255,255,255,0.08)"/>
<text x="396.9" y="381" fill="#9aa0a6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">-5%</text>
<line x1="590.7" y1="70" x2="590.7" y2="364" stroke="rgba(255,255,255,0.08)"/>
<text x="590.7" y="381" fill="#9aa0a6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+5%</text>
<line x1="687.6" y1="70" x2="687.6" y2="364" stroke="rgba(255,255,255,0.08)"/>
<text x="687.6" y="381" fill="#9aa0a6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+10%</text>
<line x1="784.5" y1="70" x2="784.5" y2="364" stroke="rgba(255,255,255,0.08)"/>
<text x="784.5" y="381" fill="#9aa0a6" font-size="10.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+15%</text>
<text x="14" y="93" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">A</text>
<text x="48" y="93" fill="#9aa0a6" font-size="12">默认 1GB</text>
<text x="252" y="93" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">51,579</text>
<text x="502.8" y="93" fill="#9aa0a6" font-size="12">基准</text>
<text x="14" y="135" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">B</text>
<text x="48" y="135" fill="#9aa0a6" font-size="12">KAOT 全量 151GB</text>
<text x="252" y="135" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">48,883</text>
<rect x="393.0" y="120" width="100.8" height="20" rx="3.5" fill="#f87171" opacity="0.88"/>
<text x="385.0" y="135" fill="#f87171" font-size="13" font-weight="700" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">-5.2%</text>
<text x="14" y="177" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">C1</text>
<text x="48" y="177" fill="#9aa0a6" font-size="12">B 但 buffer→8GB</text>
<text x="252" y="177" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">59,092</text>
<rect x="493.8" y="162" width="282.9" height="20" rx="3.5" fill="#27FF64" opacity="0.88"/>
<text x="784.7" y="177" fill="#27FF64" font-size="13" font-weight="700" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+14.6%</text>
<text x="14" y="219" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">C2</text>
<text x="48" y="219" fill="#9aa0a6" font-size="12">B 但降刷盘频率</text>
<text x="252" y="219" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">47,715</text>
<rect x="348.4" y="204" width="145.3" height="20" rx="3.5" fill="#f87171" opacity="0.88"/>
<text x="340.4" y="219" fill="#f87171" font-size="13" font-weight="700" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">-7.5%</text>
<text x="14" y="261" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">D</text>
<text x="48" y="261" fill="#9aa0a6" font-size="12">8GB + 三项裁剪</text>
<text x="252" y="261" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">58,329</text>
<rect x="493.8" y="246" width="253.9" height="20" rx="3.5" fill="#38bdf8" opacity="0.88"/>
<text x="755.7" y="261" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+13.1%</text>
<text x="14" y="303" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">E</text>
<text x="48" y="303" fill="#9aa0a6" font-size="12">安全子集 FPW off</text>
<text x="252" y="303" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">55,179</text>
<rect x="493.8" y="288" width="135.7" height="20" rx="3.5" fill="#fbbf24" opacity="0.88"/>
<text x="637.4" y="303" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+7.0%</text>
<text x="14" y="345" fill="#e8eaed" font-size="14" font-weight="700" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">E'</text>
<text x="48" y="345" fill="#9aa0a6" font-size="12">安全子集 FPW on</text>
<text x="252" y="345" fill="#e8eaed" font-size="12.5" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">56,943</text>
<rect x="493.8" y="330" width="201.5" height="20" rx="3.5" fill="#fbbf24" opacity="0.88"/>
<text x="703.3" y="345" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="start" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">+10.4%</text>
<rect x="8" y="156" width="854" height="80" rx="8" fill="rgba(39,255,100,0.05)" stroke="#27FF64" stroke-dasharray="5 4" opacity="0.6"/>
<text x="14" y="406" fill="#e8eaed" font-size="12.5">C1 只把 buffer 从 151GB 改为 8GB → <tspan fill="#27FF64" font-weight="700">+14.6%</tspan>；C2 保留 151GB、只把刷盘频率降回默认 → <tspan fill="#f87171" font-weight="700">−7.5%</tspan></text>
<text x="14" y="429" fill="#9aa0a6" font-size="11.5">⇒ 问题出在 buffer 池容量本身，与刷盘频率无关——「大池 + 高频扫描组合失配」的假设被 C2 排除</text>
</svg>